appId: com.anonymous.Stratify_gg
---
# Flow: Matches — abre tela, valida elo/PDL, solicita partida, verifica bot ou real
# Pré-condição: usuário autenticado

- launchApp:
    clearState: false

# 1. Navega para a tela de partidas (via tab ou botão)
- waitForAnimationToEnd:
    timeout: 6000

# 2. Acessa partidas pelo dashboard (botão ou tab)
- tapOn:
    text: "Partidas"
    optional: true
- tapOn:
    text: "PARTIDAS"
    optional: true

- waitForAnimationToEnd:
    timeout: 6000

# 3. Valida que mostra tier/elo do time
- assertVisible:
    text: "Bronze"
    optional: true
- assertVisible:
    text: "Prata"
    optional: true
- assertVisible:
    text: "PDL"

# 4. Verifica seção de próxima partida ou botão solicitar
- assertVisible:
    text: "SOLICITAR PARTIDA"
    optional: true
- assertVisible:
    text: "PRÓXIMA PARTIDA"
    optional: true

# 5. Solicita uma partida (se botão disponível)
- tapOn:
    text: "SOLICITAR PARTIDA"
    optional: true

- waitForAnimationToEnd:
    timeout: 12000

# 6. Confirma que foi agendado (14:00 ou 17:00)
- assertVisible:
    text: "14:00"
    optional: true
- assertVisible:
    text: "17:00"
    optional: true

# 7. Valida badge BOT se bot foi gerado
- assertVisible:
    text: "BOT"
    optional: true

# 8. Verifica histórico de partidas
- assertVisible:
    text: "HISTÓRICO"
    optional: true

# 9. Volta
- pressKey: Back
