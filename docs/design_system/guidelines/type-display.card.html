<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--surface-app); }
  .stack { display:flex; flex-direction:column; gap:14px; }
  .meta { font:var(--weight-medium) 10px var(--font-mono); color:var(--text-faint); margin-top:2px; }
</style>
</head>
<body>
  <div class="stack">
    <div>
      <div style="font:900 26px var(--font-display); letter-spacing:0.04em; color:var(--text-primary); text-transform:uppercase;">Final do Torneio</div>
      <div class="meta">Hero / display · 900 · 26px · tracking .04em · UPPER</div>
    </div>
    <div>
      <div style="font:800 18px var(--font-sans); letter-spacing:0.02em; color:var(--text-primary);">Time Principal</div>
      <div class="meta">Card title · 800 · 18px</div>
    </div>
    <div>
      <div class="eyebrow">Ações Rápidas</div>
      <div class="meta">Section eyebrow · 800 · 11px · tracking .12em · UPPER</div>
    </div>
  </div>
</body>
</html>
