<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base; 16px screen gutter; 14–24px card padding" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--surface-app); display:flex; align-items:flex-end; gap:16px; }
  .item { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .bar { background:var(--emerald-500); width:18px; border-radius:3px; }
  .n { font:700 11px var(--font-mono); color:var(--text-secondary); }
</style>
</head>
<body>
  <div class="item"><div class="bar" style="height:4px"></div><div class="n">4</div></div>
  <div class="item"><div class="bar" style="height:8px"></div><div class="n">8</div></div>
  <div class="item"><div class="bar" style="height:10px"></div><div class="n">10</div></div>
  <div class="item"><div class="bar" style="height:12px"></div><div class="n">12</div></div>
  <div class="item"><div class="bar" style="height:16px"></div><div class="n">16</div></div>
  <div class="item"><div class="bar" style="height:20px"></div><div class="n">20</div></div>
  <div class="item"><div class="bar" style="height:24px"></div><div class="n">24</div></div>
  <div class="item"><div class="bar" style="height:32px"></div><div class="n">32</div></div>
  <div class="item"><div class="bar" style="height:40px"></div><div class="n">40</div></div>
</body>
</html>
