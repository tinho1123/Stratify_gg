<!-- @dsCard group="Colors" viewport="700x170" name="Semantic & role hues" subtitle="Status, alerts, and per-role accents across team/market/training" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:18px; background:var(--surface-app); }
  .row { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; }
  .sw { border-radius:var(--radius-lg); height:54px; border:1px solid var(--border-subtle); }
  .cap { margin-top:7px; font:var(--weight-bold) 10.5px var(--font-sans); color:var(--text-secondary); }
  .hex { font:var(--weight-medium) 9.5px var(--font-mono); color:var(--text-faint); }
  .use { font:var(--weight-medium) 9px var(--font-sans); color:var(--text-ghost); margin-top:1px; }
</style>
</head>
<body>
  <div class="row">
    <div><div class="sw" style="background:var(--danger)"></div><div class="cap">Danger</div><div class="hex">#EF4444</div><div class="use">injury · alert</div></div>
    <div><div class="sw" style="background:var(--warning)"></div><div class="cap">Warning</div><div class="hex">#F59E0B</div><div class="use">ban · energy</div></div>
    <div><div class="sw" style="background:var(--info)"></div><div class="cap">Info</div><div class="hex">#6366F1</div><div class="use">market · IGL</div></div>
    <div><div class="sw" style="background:var(--accent-pink)"></div><div class="cap">Pink</div><div class="hex">#EC4899</div><div class="use">matches · AWP</div></div>
    <div><div class="sw" style="background:var(--accent-blue)"></div><div class="cap">Blue</div><div class="hex">#3B82F6</div><div class="use">awareness</div></div>
    <div><div class="sw" style="background:var(--accent-purple)"></div><div class="cap">Purple</div><div class="hex">#8B5CF6</div><div class="use">game sense</div></div>
  </div>
</body>
</html>
