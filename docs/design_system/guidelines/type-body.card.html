<!-- @dsCard group="Type" viewport="700x180" name="Body & labels" subtitle="Grotesque body, medium labels — calm against heavy headers" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--surface-app); }
  .stack { display:flex; flex-direction:column; gap:13px; }
  .meta { font:var(--weight-medium) 10px var(--font-mono); color:var(--text-faint); margin-top:2px; }
</style>
</head>
<body>
  <div class="stack">
    <div>
      <div style="font:400 15px/1.5 var(--font-sans); color:var(--text-secondary); max-width:520px;">Gerencie seu time, contrate jogadores no mercado de transferências e conquiste o topo do ranking global.</div>
      <div class="meta">Body · 400 · 15px / 1.5</div>
    </div>
    <div>
      <div style="font:600 13px var(--font-sans); color:var(--text-secondary);">E-mail · Senha · Orçamento disponível</div>
      <div class="meta">Field label · 600 · 13px</div>
    </div>
    <div>
      <div style="font:700 11px var(--font-sans); letter-spacing:0.04em; color:var(--emerald-500); text-transform:uppercase;">Online</div>
      <div class="meta">Status / pill label · 700 · 11px · tracking .04em · UPPER</div>
    </div>
  </div>
</body>
</html>
