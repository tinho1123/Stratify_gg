<!-- @dsCard group="Spacing" viewport="700x160" name="Radii" subtitle="Moderate corners 4–16px; pills fully round" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--surface-app); display:flex; gap:14px; align-items:flex-end; }
  .item { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .box { width:62px; height:62px; background:var(--surface-control); border:1px solid var(--border-strong); border-top-left-radius:0; border-bottom-right-radius:0; }
  .n { font:700 10.5px var(--font-sans); color:var(--text-secondary); }
  .px { font:500 9.5px var(--font-mono); color:var(--text-faint); margin-top:-4px; }
</style>
</head>
<body>
  <div class="item"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="n">xs</div><div class="px">4</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="n">sm</div><div class="px">6</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="n">md</div><div class="px">8</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="n">xl</div><div class="px">12</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-2xl)"></div><div class="n">2xl</div><div class="px">14</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-3xl)"></div><div class="n">3xl</div><div class="px">16</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-pill)"></div><div class="n">pill</div><div class="px">999</div></div>
</body>
</html>
